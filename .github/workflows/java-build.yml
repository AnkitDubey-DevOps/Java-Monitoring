# Build Java app, push Docker image, and create temporary URL
name: Java Monitoring

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Get project code
      - uses: actions/checkout@v4

      # Setup Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build Java application
      - name: Build
        run: mvn -f Java-Monitoring-Project-main/pom.xml package -DskipTests

      # Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./Java-Monitoring-Project-main
          file: ./Java-Monitoring-Project-main/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/java-monitoring:latest

      # Start Java application
      - name: Start App
        run: |
          JAR=$(find Java-Monitoring-Project-main/target -name '*.jar' ! -name '*.original' | head -n 1)
          test -n "$JAR" || exit 1
          nohup java -jar "$JAR" --server.port=8080 > app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://localhost:8080/ && break
            sleep 2
          done
          curl -f http://localhost:8080/

      # Install Cloudflare Tunnel
      - uses: AnimMouse/setup-cloudflared@v2

      # Create temporary public URL
      - name: Start Tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:8080

      # Keep application running for 25 minutes
      - name: Keep App Running
        run: sleep 150
