
name: Java Monitoring - Temporary Demo

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  run-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application
        run: mvn -B -f Java-Monitoring-Project-main/pom.xml clean package -DskipTests

      - name: Start Spring Boot Application
        shell: bash
        run: |
          JAR=$(find Java-Monitoring-Project-main/target \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*.original' | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: Application JAR not found"
            exit 1
          fi

          nohup java -jar "$JAR" --server.port=8080 \
            > /tmp/java-app.log 2>&1 &
          echo $! > /tmp/java-app.pid

          for i in {1..60}; do
            if curl -sS -o /dev/null http://127.0.0.1:8080/; then
              echo "Application is responding on port 8080"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/java-app.pid)" 2>/dev/null; then
              echo "Application stopped unexpectedly:"
              cat /tmp/java-app.log
              exit 1
            fi

            sleep 2
          done

          echo "Application did not respond within 120 seconds:"
          cat /tmp/java-app.log
          exit 1

      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Start Temporary Public Tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:8080

      - name: Keep Demo Running
        run: |
          echo "The temporary tunnel should be listed in the previous step's logs."
          sleep 1500

      - name: Shutdown Cloudflared
        if: always()
        uses: AnimMouse/setup-cloudflared/shutdown@v2

      - name: Show Application Logs if Failed
        if: failure()
        run: cat /tmp/java-app.log || true
