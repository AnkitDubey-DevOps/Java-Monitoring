
name: Java Monitoring - Temporary Demo

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  run-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application
        run: mvn -B -f Java-Monitoring-Project-main/pom.xml clean package -DskipTests

      - name: Start Spring Boot Application
        shell: bash
        run: |
          JAR=$(find Java-Monitoring-Project-main/target \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*.original' | head -n 1)

          test -n "$JAR" || { echo "JAR not found"; exit 1; }

          nohup java -jar "$JAR" --server.port=8080 \
            > /tmp/java-app.log 2>&1 &

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Application is responding on port 8080"
              break
            fi
            if ! kill -0 "$!" 2>/dev/null; then
              cat /tmp/java-app.log
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/ > /dev/null || {
            cat /tmp/java-app.log
            exit 1
          }

      - name: Start Temporary Public Tunnel
        uses: AnimMouse/setup-cloudflared@v2
        with:
          url: http://localhost:8080

      - name: Keep Demo Running
        run: |
          echo "Temporary URL tunnel started."
          echo "Open the URL shown in the previous step's logs."
          sleep 1500
